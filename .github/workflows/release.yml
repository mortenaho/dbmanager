name: Build and release

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 file pkg-config libssl-dev

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__-${{ github.sha }}
          releaseName: DB Manager v__VERSION__ (${{ github.sha }})
          releaseBody: |
            Built from commit ${{ github.sha }} on ${{ github.ref_name }}.

            - Debian package: `.deb`
            - Portable Linux build: `.AppImage`
            - Windows installer: `.exe`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
