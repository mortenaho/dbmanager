[package]
name = "dbmanager"
version = "0.1.0"
description = "DB Manager — a desktop SQL client"
authors = ["you"]
edition = "2024"

[features]
# `tauri dev` passes --no-default-features. A plain release build must
# embed the UI; otherwise the window tries to open the Vite server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "dbmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "time", "sync", "io-util", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
postgres-native-tls = "0.5"
mysql_async = "0.34"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "chrono", "native-tls", "rust_decimal"] }
tokio-util = { version = "0.7", features = ["compat"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
rust_decimal = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
